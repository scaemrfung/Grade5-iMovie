<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson · Grade 5 iMovie</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;650;700&family=Newsreader:opsz,wght@6..72,500;6..72,560;6..72,650&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    const n = Number(new URLSearchParams(location.search).get("n") || 1);
    const lesson = LESSONS.find((l) => l.number === n) || LESSONS[0];
    document.title = "Lesson " + lesson.number + " · " + lesson.title;
    const prev = LESSONS.find((l) => l.number === lesson.number - 1);
    const next = LESSONS.find((l) => l.number === lesson.number + 1);
    const groups = lesson.groups.map((g) => `
      <div class="note">
        <h3 class="teacher-only">Student steps · ${g.title}</h3>
        <h3 class="student-only">Your steps · ${g.title}</h3>
        ${g.intro ? "<p>" + g.intro + "</p>" : ""}
        <ol class="steps">${g.steps.map((s) => "<li>" + s + "</li>").join("")}</ol>
      </div>
    `).join("");
    document.getElementById("app").innerHTML = `
      <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start;">
        <div>
          <p class="kicker">Lesson ${lesson.number} of 13 · ${lesson.duration}</p>
          <h1>${lesson.title}</h1>
          <p class="lead">${lesson.skill}</p>
        </div>
        <div class="toolbar"><button class="ghost-btn" onclick="window.print()">Print</button></div>
      </div>
      <div class="actions">
        ${prev ? '<a class="btn btn-ghost" href="lesson.html?n=' + prev.number + '">← Lesson ' + prev.number + "</a>" : '<a class="btn btn-ghost" href="index.html">Course map</a>'}
        ${next ? '<a class="btn btn-primary" href="lesson.html?n=' + next.number + '">Lesson ' + next.number + " →</a>" : '<a class="btn btn-primary" href="projects.html">Hand-in projects →</a>'}
      </div>
      <div class="note teacher-only"><h3>Teacher tips</h3><ul>${lesson.tips.map((t) => "<li>" + t + "</li>").join("")}</ul></div>
      <div class="note"><h3>Learning goals</h3><ul>${lesson.objectives.map((t) => "<li>" + t + "</li>").join("")}</ul></div>
      <div class="note"><h3>You will need</h3><ul>${lesson.youWillNeed.map((t) => "<li>" + t + "</li>").join("")}</ul></div>
      <div class="note"><h3>Warm-up</h3><p>${lesson.warmup}</p></div>
      ${groups}
      <div class="note"><h3>Practice</h3><ul>${lesson.practice.map((t) => "<li>" + t + "</li>").join("")}</ul></div>
      <div class="note"><h3>Check for understanding</h3><ul>${lesson.check.map((t) => "<li>" + t + "</li>").join("")}</ul></div>
    `;
  </script>
</body>
</html>
